lcr-modules:
    ichorcna_burden_offtarget:
        inputs:
            sample_bam: "__UPDATE__"
            sample_bai: "__UPDATE__"
            ichorcna_pon: "__UPDATE__"
            panel_bed: "__UPDATE__"
            # A non-empty ichorCNA 99-outputs root bypasses preprocessing and
            # ichorCNA, and takes precedence over sample_wig.
            ichorcna_output_dir: ""
            # A non-empty path bypasses the complete BAM-to-WIG branch.
            sample_wig: ""

        scratch_subdirectories: []

        options:
            ichorcna_branch: "master"
            binsize_kb: 1000
            bamCoverage: "--ignoreDuplicates --extendReads"

            src:
                burden_index: "{MODSDIR}/src/burden_index.R"
                aggregate_burden: "{MODSDIR}/src/aggregate_burden.R"
                plot_vc_diagnostic: "{MODSDIR}/src/plot_vc_diagnostic.R"

            ichorcna_run:
                exome: NULL
                genome_ucsc:
                    grch37: "hg19"
                    grch38: "hg38"
                    hg19: "hg19"
                    hg38: "hg38"
                centromere:
                    grch37: "GRCh37.p13_centromere_UCSC-gapTable.txt"
                    grch38: "GRCh38.GCA_000001405.2_centromere_acen.txt"
                    hg19: "GRCh37.p13_centromere_UCSC-gapTable.txt"
                    hg38: "GRCh38.GCA_000001405.2_centromere_acen.txt"
                genomeStyle:
                    grch37: "NCBI"
                    grch38: "NCBI"
                    hg19: "UCSC"
                    hg38: "UCSC"
                opts: >-
                    --normal 'c(0.5,0.6,0.7,0.8,0.9,0.95,0.99)'
                    --ploidy 'c(2,3,4)'
                    --maxCN 7
                    --estimateScPrevalence TRUE
                    --scStates 'c(1,3)'
                    --txnE 0.99
                    --txnStrength 1000

            burden:
                exclude_bed: ""
                min_bins: 200
                winsor_p: 0.005
                window_widths: "1,2,4,8,16"
                detect_w: 8
                n_perm: 500
                n_boot: 300
                block: 20
                seed: 1
                fga_k: 2.5
                include_sex_chrom: False

        conda_envs:
            offtarget_bam: "{REPODIR}/modules/ichorcna_offtarget/1.0/envs/samtools-bedtools.yaml"
            bamCoverage: "{REPODIR}/modules/ichorcna_offtarget/1.0/envs/deeptools.env.yaml"
            bigwigToWig: "{REPODIR}/modules/ichorcna_offtarget/1.0/envs/ucsc-bigwigtowig.env.yaml"
            convert_wig: "{REPODIR}/modules/ichorcna_offtarget/1.0/envs/bedops_tools.env.yaml"
            ichorcna_run: "{REPODIR}/modules/ichorcna_offtarget/1.0/envs/ichorcna-0.2.0.yaml"

        threads:
            offtarget_bam: 4
            bamCoverage: 20
            bigwigToWig: 1
            convert_wig: 1
            ichorcna_run: 4

        resources:
            offtarget_bam:
                mem_mb: 8000
                bam: 1
            bamCoverage:
                mem_mb: 40000
                bam: 1
            bigwigToWig:
                mem_mb: 6000
                bam: 1
            convert_wig:
                mem_mb: 6000
                bam: 1
            compile_wigs:
                mem_mb: 2000
            ichorcna_run:
                mem_mb: 8000
                bam: 1
            burden:
                mem_mb: 4000
            plot_vc_diagnostic:
                mem_mb: 2000
            aggregate:
                mem_mb: 4000

        pairing_config:
            genome:
                run_paired_tumours: False
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: True
            capture:
                run_paired_tumours: False
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: True
