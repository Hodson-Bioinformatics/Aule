lcr-modules:

    ichorcna_2pass_offtarget:

        inputs:
            # Available wildcards: {seq_type} {genome_build} {tumour_id} {binSize} (pon only)
            sample_bam:   "__UPDATE__"
            sample_bai:   "__UPDATE__"
            # PON generated by ichorcna_pon_offtarget (or ichorcna_pon) module
            ichorcna_pon: "__UPDATE__"
            # BED file with panel regions to exclude (e.g. panel + 2 kb flanks, collapsed)
            panel_bed:    "__UPDATE__"
            # Optional: pre-built compiled off-target WIG from ichorcna_offtarget.
            # When set, the entire BAM -> bigWig -> WIG pipeline is skipped.
            # Available wildcards: {seq_type} {genome_build} {tumour_id} {binSize}
            # Leave as empty string "" to build the WIG from scratch.
            sample_wig:   ""

        scratch_subdirectories: []

        options:
            ichorcna_branch: "master"
            # Bin size in kilobases; must be one of 10, 50, 500, 1000
            binsize_kb: 1000
            bamCoverage: "--ignoreDuplicates --extendReads"

            # Paths to custom R helper scripts (resolved via {MODSDIR})
            src:
                pass1_qc:          "{MODSDIR}/src/pass1_qc.R"
                final_confidence:  "{MODSDIR}/src/final_confidence.R"
                combine_plots:     "{MODSDIR}/src/combine_genome_wide_plots.R"
                aggregate_params:  "{MODSDIR}/src/aggregate_params.R"

            ichorcna_run:
                # Optional BED file for targeted regions (NULL = genome-wide)
                exome: NULL

                genome_ucsc:
                    grch37: "hg19"
                    grch38: "hg38"
                    hg19:   "hg19"
                    hg38:   "hg38"

                centromere:
                    grch37: "GRCh37.p13_centromere_UCSC-gapTable.txt"
                    grch38: "GRCh38.GCA_000001405.2_centromere_acen.txt"
                    hg19:   "GRCh37.p13_centromere_UCSC-gapTable.txt"
                    hg38:   "GRCh38.GCA_000001405.2_centromere_acen.txt"

                genomeStyle:
                    grch37: "NCBI"
                    grch38: "NCBI"
                    hg19:   "UCSC"
                    hg38:   "UCSC"

                # Pass 1: broad exploration over normal fractions and ploidy states
                pass1_opts: >-
                    --normal 'c(0.5,0.6,0.7,0.8,0.9,0.95,0.99)'
                    --ploidy 'c(2,3,4)'
                    --maxCN 7
                    --estimateScPrevalence TRUE
                    --scStates 'c(1,3)'
                    --txnE 0.99
                    --txnStrength 1000

                # Highest normal initialisation used in Pass 1 (used to detect
                # "at-edge" solutions in pass1_qc.R)
                pass1_max_normal_init: 0.99

        conda_envs:
            offtarget_bam:    "{MODSDIR}/envs/samtools-bedtools.yaml"
            bamCoverage:      "{MODSDIR}/envs/deeptools.env.yaml"
            bigwigToWig:      "{MODSDIR}/envs/ucsc-bigwigtowig.env.yaml"
            convert_wig:      "{MODSDIR}/envs/bedops_tools.env.yaml"
            ichorcna_run:     "{MODSDIR}/envs/ichorcna-0.2.0.yaml"
            aggregate_plots:  "{MODSDIR}/envs/aggregate-plots.yaml"

        threads:
            offtarget_bam: 4
            bamCoverage:   20
            bigwigToWig:   1
            convert_wig:   1
            ichorcna_run:  4

        resources:
            offtarget_bam:
                mem_mb: 8000
                bam: 1
            bamCoverage:
                mem_mb: 40000
                bam: 1
            bigwigToWig:
                mem_mb: 6000
                bam: 1
            convert_wig:
                mem_mb: 6000
                bam: 1
            compile_wigs:
                mem_mb: 2000
            ichorcna_run:
                mem_mb: 8000
                bam: 1
            pass1_qc:
                mem_mb: 2000
            confidence:
                mem_mb: 2000
            aggregate_pdf:
                mem_mb: 16000
            aggregate_params:
                mem_mb: 4000

        pairing_config:
            genome:
                run_paired_tumours:           False
                run_unpaired_tumours_with:    "no_normal"
                run_paired_tumours_as_unpaired: True
            capture:
                run_paired_tumours:           False
                run_unpaired_tumours_with:    "no_normal"
                run_paired_tumours_as_unpaired: True
